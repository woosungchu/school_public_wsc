<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정인 마트 계산대</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, 'Noto Sans KR', sans-serif; background: #edf0f3; color: #222; }
    .wrap { width: 100%; min-height: 100vh; background: #f7f8fa; padding: 18px 18px 190px; }
    .top { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 12px; }
    .time { font-size: 15px; }
    .title { font-size: 24px; font-weight: 900; margin: 10px 2px 12px; }
    .notice { background: white; border-radius: 18px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); line-height: 1.5; }
    .section-title { font-size: 17px; font-weight: 900; margin: 18px 2px 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .item { background: white; border-radius: 20px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.05); text-align: center; min-height: 210px; display: flex; flex-direction: column; justify-content: center; }
    .emoji { font-size: 54px; margin-bottom: 10px; }
    .name { font-weight: 900; margin-bottom: 6px; font-size: 20px; }
    .price { color: #555; font-weight: 700; margin-bottom: 14px; font-size: 18px; }
    button { border: 0; border-radius: 999px; padding: 10px 12px; font-weight: 900; cursor: pointer; font-size: 14px; }
    .add { background: #fee500; color: #222; width: 100%; }
    .cart-panel { position: fixed; left: 0; bottom: 0; width: 100%; background: white; border-top: 2px solid #ddd; padding: 16px 22px; box-shadow: 0 -4px 18px rgba(0,0,0,.14); }
    .cart-head { display: flex; justify-content: space-between; align-items: center; font-weight: 900; margin-bottom: 8px; }
    .cart-list { max-height: 74px; overflow-y: auto; font-size: 14px; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 6px 0; margin-bottom: 10px; }
    .cart-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
    .delete { background: #eee; padding: 4px 9px; margin-left: 5px; }
    .total { display: flex; justify-content: space-between; font-size: 22px; font-weight: 900; margin: 8px 0 10px; }
    .actions { display: grid; grid-template-columns: 3fr 1fr; gap: 10px; max-width: 700px; margin: 0 auto; }
    .pay { background: #222; color: white; font-size: 22px; padding: 18px; }
    .reset { background: #e9ecef; color: #333; font-size: 18px; }
    .empty { color: #777; text-align: center; padding: 8px 0; }
    .log-box { background: white; border-radius: 18px; padding: 14px; margin-top: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .log-title { font-weight: 900; margin-bottom: 8px; }
    .log { list-style: none; padding: 0; margin: 0; }
    .log li { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 8px 0; font-size: 14px; }
    .minus { color: #d73737; font-weight: 900; }
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); align-items: center; justify-content: center; padding: 20px; }
    .modal { max-width: 360px; width: 100%; background: white; border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
    .modal h2 { margin: 0 0 12px; font-size: 26px; }
    .modal-money { font-size: 36px; font-weight: 900; margin: 14px 0; }
    .modal p { line-height: 1.5; color: #555; }
    .close { width: 100%; background: #222; color: white; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><div id="nowTime" class="time">09:00</div><div>POS 🔋</div></div>
    <div class="title">정인 마트 계산대</div>

    <div class="section-title">상품 선택</div>
    <div class="grid" id="itemGrid"></div>

    <div class="log-box">
      <div class="log-title">결제 내역</div>
      <ul class="log" id="logList"><li><span>아직 결제 내역이 없습니다.</span><span>0원</span></li></ul>
    </div>
  </div>

  <div class="cart-panel">
    <div style="max-width:1200px;margin:0 auto;">
    <div class="cart-head"><span>계산할 물건</span><span id="cartCount">0개</span></div>
    <div class="cart-list" id="cartList"><div class="empty">담은 물건이 없습니다.</div></div>
    <div class="total"><span>결제 금액</span><span id="totalText">0원</span></div>
    <div class="actions">
      <button class="pay" onclick="payItems()">카드 결제하기</button>
      <button class="reset" onclick="resetCart()">비우기</button>
    </div>
  </div>
  </div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2>결제 완료</h2>
      <div class="modal-money" id="modalMoney">0원</div>
      <p>카드 결제가 되었습니다.<br />이제 은행앱에서 같은 금액을 차감해 주세요.</p>
      <button class="close" onclick="closeModal()">확인</button>
    </div>
  </div>

<script>
let cart = [];
let payCount = 0;

const items = [
  { name: '물', price: 1000, emoji: '💧' },
  { name: '우유', price: 3000, emoji: '🥛' },
  { name: '빵', price: 2000, emoji: '🍞' },
  { name: '라면', price: 1500, emoji: '🍜' },
  { name: '과자', price: 2500, emoji: '🍪' },
  { name: '도시락', price: 7000, emoji: '🍱' },
  { name: '휴지', price: 5000, emoji: '🧻' },

  // 퇴근 후 장보기 느낌
  { name: '양파', price: 3000, emoji: '🧅' },
  { name: '당근', price: 2500, emoji: '🥕' },
  { name: '감자', price: 4000, emoji: '🥔' },
  { name: '사과', price: 5000, emoji: '🍎' },
  { name: '바나나', price: 4000, emoji: '🍌' },
  { name: '딸기', price: 8000, emoji: '🍓' },
  { name: '계란', price: 6500, emoji: '🥚' },
  { name: '고기', price: 12000, emoji: '🥩' },
  { name: '쌀', price: 18000, emoji: '🍚' }
];

const itemGrid = document.getElementById('itemGrid');
const cartList = document.getElementById('cartList');
const cartCount = document.getElementById('cartCount');
const totalText = document.getElementById('totalText');
const logList = document.getElementById('logList');
const nowTimeEl = document.getElementById('nowTime');
const modalBg = document.getElementById('modalBg');
const modalMoney = document.getElementById('modalMoney');

function won(n){ return n.toLocaleString('ko-KR') + '원'; }
function getTotal(){ return cart.reduce((sum, item) => sum + item.price, 0); }

function renderItems(){
  itemGrid.innerHTML = items.map((item, index) => `
    <div class="item">
      <div class="emoji">${item.emoji}</div>
      <div class="name">${item.name}</div>
      <div class="price">${won(item.price)}</div>
      <button class="add" onclick="addToCart(${index})">담기</button>
    </div>
  `).join('');
}

function renderCart(){
  const total = getTotal();
  cartCount.textContent = cart.length + '개';
  totalText.textContent = won(total);
  if(cart.length === 0){
    cartList.innerHTML = '<div class="empty">담은 물건이 없습니다.</div>';
    return;
  }
  cartList.innerHTML = cart.map((item, index) => `
    <div class="cart-row">
      <span>${item.emoji} ${item.name}</span>
      <span>${won(item.price)} <button class="delete" onclick="removeItem(${index})">×</button></span>
    </div>
  `).join('');
}

function addToCart(index){ cart.push(items[index]); renderCart(); }
function removeItem(index){ cart.splice(index, 1); renderCart(); }
function resetCart(){ cart = []; renderCart(); }

function addLog(amount){
  if(logList.innerText.includes('아직 결제 내역이 없습니다')) logList.innerHTML = '';
  payCount += 1;
  const li = document.createElement('li');
  li.innerHTML = `<span>${payCount}번째 카드 결제</span><span class="minus">-${won(amount)}</span>`;
  logList.prepend(li);
}

function payItems(){
  const total = getTotal();
  if(cart.length === 0){ alert('먼저 물건을 담으세요.'); return; }
  addLog(total);
  modalMoney.textContent = won(total);
  modalBg.style.display = 'flex';
  resetCart();
}

function closeModal(){ modalBg.style.display = 'none'; }

function setTime(){
  const now = new Date();
  nowTimeEl.textContent = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
}

renderItems();
renderCart();
setTime();
setInterval(setTime, 1000);
</script>
</body>
</html>
