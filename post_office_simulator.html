<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>우체국 소포 접수</title>
<style>
  :root{
    --bg:#f3f4f6; --card:#fff; --ink:#1d2430; --sub:#5d6875; --line:#dfe3e8;
    --red:#d9361f; --red-soft:#fdeceA; --blue:#1b63b0; --green:#1f8a4c; --hl:#fff3c4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
       user-select:none;-webkit-user-select:none}

  /* 상단 바 */
  .top{display:flex;align-items:center;gap:12px;background:var(--red);color:#fff;
       padding:10px 16px}
  .top h1{margin:0;font-size:clamp(22px,2.8vw,36px);letter-spacing:.02em;flex:1}
  .top h1 small{font-size:.55em;font-weight:600;opacity:.9;margin-left:10px}
  .tbtn{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:14px;
        width:58px;height:58px;font-size:30px;cursor:pointer;display:grid;place-items:center;
        text-decoration:none}
  .tbtn:active{background:rgba(255,255,255,.35)}
  .tbtn.say{width:auto;padding:0 18px;font-size:22px;font-weight:800;gap:6px;display:flex;align-items:center}
  .tbtn.say span{font-size:30px}

  .main{display:grid;grid-template-columns:minmax(320px,0.95fr) 1.25fr;gap:16px;padding:16px;
        max-width:1500px;margin:0 auto}
  @media (max-width:820px){.main{grid-template-columns:1fr}}
  .panel{background:var(--card);border-radius:22px;border:2px solid var(--line);padding:18px}

  /* 입력 */
  .lbl{font-size:clamp(18px,2vw,24px);font-weight:800;color:var(--sub);margin:0 0 8px}
  .screen{background:#0f1a14;color:#7dff9b;border-radius:16px;padding:12px 18px;
          display:flex;align-items:baseline;justify-content:flex-end;gap:10px;
          font-family:"Consolas","DejaVu Sans Mono",monospace;min-height:110px}
  .screen .num{font-size:clamp(54px,7vw,92px);font-weight:700;line-height:1;letter-spacing:.03em}
  .screen .num.empty{color:#3a6b48}
  .screen .unit{font-size:clamp(30px,3.5vw,46px);font-weight:700}
  .unitrow{display:flex;gap:10px;margin:12px 0}
  .unitrow button{flex:1;height:60px;border-radius:14px;border:3px solid var(--line);background:#fff;
                  font-size:28px;font-weight:800;color:var(--sub);cursor:pointer}
  .unitrow button.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pad button{height:clamp(64px,9vh,86px);border-radius:16px;border:2px solid var(--line);
              background:#fafbfc;font-size:clamp(30px,3.6vw,44px);font-weight:800;color:var(--ink);cursor:pointer}
  .pad button:active{background:#e8ecf1;transform:scale(.97)}
  .pad .fn{font-size:30px;color:var(--sub)}
  .pad .clr{grid-column:1 / -1;height:56px;font-size:24px}
  .pad button.off{opacity:.25}
  .result.stale{opacity:.3}
  .go{width:100%;margin-top:12px;height:clamp(70px,10vh,92px);border:0;border-radius:18px;
      background:var(--red);color:#fff;font-size:clamp(28px,3.4vw,42px);font-weight:900;cursor:pointer;letter-spacing:.05em}
  .go:active{filter:brightness(.92);transform:scale(.99)}

  /* 결과 */
  .result{text-align:center;padding:6px 4px 4px;min-height:330px;display:flex;flex-direction:column;justify-content:center}
  .wread{font-size:clamp(20px,2.3vw,30px);color:var(--sub);font-weight:700}
  .wread b{color:var(--ink)}
  .band{display:inline-block;margin:10px auto 4px;background:var(--red-soft);color:var(--red);
        border-radius:999px;padding:6px 22px;font-size:clamp(20px,2.3vw,28px);font-weight:800}
  .fee{font-size:clamp(76px,10vw,140px);font-weight:900;line-height:1.05;letter-spacing:-.01em;margin:6px 0 0}
  .fee .won{font-size:.45em;margin-left:6px}
  .feeread{font-size:clamp(28px,3.4vw,44px);font-weight:800;color:var(--blue);margin-top:4px}
  .money{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin-top:16px;min-height:70px}
  .bill{width:clamp(110px,11vw,150px);height:clamp(54px,5.4vw,72px);border-radius:8px;display:flex;align-items:center;justify-content:center;
        font-weight:900;font-size:clamp(18px,1.9vw,24px);color:#1d2430;border:2px solid rgba(0,0,0,.18);position:relative;
        box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .b10000{background:#b9d99a}
  .b5000{background:#f1c08d}
  .b1000{background:#a9cbe8}
  .coin{width:clamp(56px,5.4vw,72px);height:clamp(56px,5.4vw,72px);border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4f4f4,#b9bcc0);
        border:3px solid #9ea2a7;display:grid;place-items:center;font-weight:900;font-size:clamp(16px,1.6vw,20px);color:#3c4148}
  .count{font-size:clamp(18px,1.9vw,24px);font-weight:800;color:var(--sub);margin-top:8px}
  .msg{font-size:clamp(28px,3.4vw,44px);font-weight:800;color:var(--sub);line-height:1.4}
  .msg.warn{color:var(--red)}
  .msg .em{font-size:1.8em;display:block}

  /* 요금표 */
  table{width:100%;border-collapse:collapse;margin-top:16px;font-size:clamp(17px,1.8vw,23px)}
  caption{text-align:left;font-weight:800;font-size:clamp(18px,2vw,24px);margin-bottom:6px}
  caption small{font-weight:600;color:var(--sub);font-size:.75em;margin-left:6px}
  th,td{border:2px solid var(--line);padding:8px 10px;text-align:center}
  th{background:#f0f2f5;color:var(--sub)}
  td.price{font-weight:900}
  tr.hl td{background:var(--hl);border-color:#f0c33c}
  tr.hl td.price{color:var(--red)}
  .note{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.5}

  /* 말하기 대본 */
  .modal{position:fixed;inset:0;background:rgba(10,14,20,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal.open{display:flex}
  .sheet{background:#fff;border-radius:24px;max-width:1100px;width:100%;max-height:92vh;overflow:auto;padding:22px 24px 26px}
  .sheet .hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .sheet h2{margin:0;font-size:clamp(26px,3vw,38px);flex:1}
  .x{border:0;background:#eef1f5;border-radius:14px;width:58px;height:58px;font-size:30px;cursor:pointer}
  .line{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-radius:16px;margin-bottom:10px;
        font-size:clamp(24px,2.8vw,36px);line-height:1.4;cursor:pointer}
  .line.staff{background:#fdeee9}
  .line.cust{background:#e8f1fb}
  .line.now{outline:4px solid #f0c33c}
  .who{flex:none;border-radius:999px;padding:2px 14px;font-size:.62em;font-weight:900;color:#fff;margin-top:.35em}
  .staff .who{background:var(--red)}
  .cust .who{background:var(--blue)}
  .line .v{font-weight:900;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
  .line .act{color:var(--sub);font-size:.7em}
  .extra{margin-top:16px;border-top:2px dashed var(--line);padding-top:12px}
  .extra h3{margin:0 0 8px;font-size:clamp(20px,2.2vw,28px);color:var(--sub)}
</style>
</head>
<body>

<div class="top">
  <a class="tbtn" href="index.html" title="학습자료 목록">🏠</a>
  <h1>📦 정인 우체국 <small>소포 접수 창구</small></h1>
  <button class="tbtn" id="fsBtn" title="전체 화면">⛶</button>
  <button class="tbtn say" id="sayBtn" title="말하기 대본"><span>🗣️</span>말하기</button>
</div>

<div class="main">
  <!-- 입력 -->
  <section class="panel">
    <p class="lbl">① 저울의 숫자를 입력하세요</p>
    <div class="screen"><span class="num empty" id="num">0</span><span class="unit" id="unitTxt">g</span></div>
    <div class="unitrow">
      <button id="uG" class="on">g 그램</button>
      <button id="uKg">kg 킬로그램</button>
    </div>
    <div class="pad" id="pad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button data-k="." id="dot">.</button><button>0</button><button class="fn" data-k="back">⌫</button>
      <button class="fn clr" data-k="clear">전체 지우기</button>
    </div>
    <button class="go" id="go">② 요금 확인</button>
  </section>

  <!-- 결과 + 요금표 -->
  <section class="panel">
    <div class="result" id="result">
      <div class="msg"><span class="em">⚖️</span>상자를 저울에 올리고<br>무게를 입력하세요</div>
    </div>
    <table id="tbl">
      <caption>소포 요금표 <small>등기소포 · 창구 접수 · 다음 날 배달</small></caption>
      <thead><tr><th>무게</th><th>그램으로</th><th>요금</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="note">우체국 공식 요금 안내(국내 등기소포 익일배달) 기준입니다. 실제 요금은 상자 크기가 크면 한 단계 올라갈 수 있어요. 30kg이 넘는 소포는 보낼 수 없어요.</div>
  </section>
</div>

<!-- 말하기 대본 -->
<div class="modal" id="modal">
  <div class="sheet">
    <div class="hd"><h2>🗣️ 말하기 대본</h2><button class="x" id="closeBtn">✕</button></div>
    <div id="script"></div>
    <div class="extra">
      <h3>이럴 때는 이렇게 말해요</h3>
      <div id="extra"></div>
    </div>
  </div>
</div>

<script>
(function(){
  // 우체국 국내 등기소포 창구접수 익일배달 요금 (상한 g, 요금 원)
  var RATES = [
    {max:3000,  label:"3kg 이하",      g:"3,000g까지",      fee:4000},
    {max:5000,  label:"3kg 초과 ~ 5kg",  g:"5,000g까지",      fee:4500},
    {max:7000,  label:"5kg 초과 ~ 7kg",  g:"7,000g까지",      fee:5000},
    {max:10000, label:"7kg 초과 ~ 10kg", g:"10,000g까지",     fee:6000},
    {max:15000, label:"10kg 초과 ~ 15kg",g:"15,000g까지",     fee:7000},
    {max:20000, label:"15kg 초과 ~ 20kg",g:"20,000g까지",     fee:8000},
    {max:25000, label:"20kg 초과 ~ 25kg",g:"25,000g까지",     fee:11000},
    {max:30000, label:"25kg 초과 ~ 30kg",g:"30,000g까지",     fee:13000}
  ];

  var $ = function(id){ return document.getElementById(id); };
  var input = "", unit = "g", last = null;

  // 요금표 그리기
  var tb = document.querySelector("#tbl tbody");
  RATES.forEach(function(r, i){
    var tr = document.createElement("tr");
    tr.id = "r" + i;
    tr.innerHTML = "<td>" + r.label + "</td><td>" + r.g + "</td><td class='price'>" + comma(r.fee) + "원</td>";
    tb.appendChild(tr);
  });

  function comma(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  // 숫자 → 한글 읽기 (예: 4500 → 사천오백)
  var D = ["","일","이","삼","사","오","육","칠","팔","구"];
  function under10000(n){
    var s = "", units = [[1000,"천"],[100,"백"],[10,"십"],[1,""]];
    units.forEach(function(u){
      var d = Math.floor(n / u[0]) % 10;
      if (!d) return;
      s += (d === 1 && u[1] ? "" : D[d]) + u[1];
    });
    return s;
  }
  function korean(n){
    if (n === 0) return "영";
    var man = Math.floor(n / 10000), rest = n % 10000, s = "";
    if (man) s += (man === 1 ? "" : under10000(man)) + "만 ";
    if (rest) s += under10000(rest);
    return s.trim();
  }
  function digitsKorean(str){ // 소수점 아래는 한 자리씩
    var Z = ["영","일","이","삼","사","오","육","칠","팔","구"];
    return str.split("").map(function(c){ return Z[+c]; }).join("");
  }

  function grams(){
    if (!input || input === ".") return 0;
    var v = parseFloat(input);
    return unit === "kg" ? Math.round(v * 1000) : Math.round(v);
  }

  function render(){
    var el = $("num");
    el.textContent = input || "0";
    el.classList.toggle("empty", !input);
    $("unitTxt").textContent = unit;
  }

  function press(k){
    if (k === "clear"){ input = ""; }
    else if (k === "back"){ input = input.slice(0, -1); }
    else if (k === "."){
      if (unit !== "kg" || input.indexOf(".") >= 0) return;
      input = (input || "0") + ".";
    } else {
      if (input.replace(".", "").length >= 6) return;
      if (input === "0") input = "";
      if (input.indexOf(".") >= 0 && input.split(".")[1].length >= 3) return;
      input += k;
    }
    render();
    $("result").classList.add("stale");
  }

  function setUnit(u){
    unit = u;
    $("uG").classList.toggle("on", u === "g");
    $("uKg").classList.toggle("on", u === "kg");
    $("dot").classList.toggle("off", u !== "kg");
    if (u === "g" && input.indexOf(".") >= 0) input = input.split(".")[0];
    render();
  }

  function weightText(){
    if (unit === "kg"){
      var parts = input.split(".");
      var r = korean(parseInt(parts[0] || "0", 10));
      if (parts[1]) r += " 점 " + digitsKorean(parts[1]);
      return {num: input + "kg", read: r + " 킬로그램"};
    }
    var g = parseInt(input, 10);
    return {num: comma(g) + "g", read: korean(g) + " 그램"};
  }

  function moneyHtml(fee){
    var kinds = [[10000,"b10000","만 원"],[5000,"b5000","오천 원"],[1000,"b1000","천 원"],[500,"coin","오백 원"]];
    var html = "", cnt = [], left = fee;
    kinds.forEach(function(k){
      var n = Math.floor(left / k[0]); left -= n * k[0];
      if (!n) return;
      cnt.push(k[2] + " " + n + (k[1] === "coin" ? "개" : "장"));
      for (var i = 0; i < n; i++){
        html += k[1] === "coin"
          ? "<div class='coin'>500</div>"
          : "<div class='bill " + k[1] + "'>" + comma(k[0]) + "원</div>";
      }
    });
    return "<div class='money'>" + html + "</div><div class='count'>" + cnt.join(" + ") + "</div>";
  }

  function check(){
    document.querySelectorAll("#tbl tr.hl").forEach(function(t){ t.classList.remove("hl"); });
    var g = grams(), res = $("result");
    res.classList.remove("stale");
    if (!g){
      last = null;
      res.innerHTML = "<div class='msg'><span class='em'>⚖️</span>먼저 무게를 입력하세요</div>";
      return;
    }
    var w = weightText();
    if (g > 30000){
      last = {w: w, fee: null};
      res.innerHTML = "<div class='wread'>무게 <b>" + w.num + "</b> (" + w.read + ")</div>" +
        "<div class='msg warn'><span class='em'>🚫</span>30kg이 넘어서<br>보낼 수 없어요</div>";
      return;
    }
    var idx = 0;
    while (g > RATES[idx].max) idx++;
    var r = RATES[idx];
    $("r" + idx).classList.add("hl");
    last = {w: w, fee: r.fee};
    res.innerHTML =
      "<div class='wread'>무게 <b>" + w.num + "</b> (" + w.read + ")</div>" +
      "<div><span class='band'>" + r.label + "</span></div>" +
      "<div class='fee'>" + comma(r.fee) + "<span class='won'>원</span></div>" +
      "<div class='feeread'>" + korean(r.fee) + " 원</div>" +
      moneyHtml(r.fee);
  }

  // 말하기 대본
  function v(t){ return "<span class='v'>" + t + "</span>"; }
  function buildScript(){
    var wTxt = last ? last.w.read.replace(/ /g, " ") : "______";
    var feeTxt = last && last.fee ? korean(last.fee) + " 원" : "______ 원";
    var lines;
    if (last && last.fee === null){
      lines = [
        ["staff","어서 오세요. 무엇을 도와드릴까요?"],
        ["cust","소포를 보내려고 왔어요."],
        ["staff","상자를 저울 위에 올려 주세요.","(손님이 상자를 올린다)"],
        ["staff","무게는 " + v(wTxt) + "입니다."],
        ["staff","죄송합니다. 30킬로그램이 넘어서 보낼 수 없어요."],
        ["staff","상자를 두 개로 나누어 주세요."],
        ["cust","네, 알겠습니다."]
      ];
    } else {
      lines = [
        ["staff","어서 오세요. 무엇을 도와드릴까요?"],
        ["cust","소포를 보내려고 왔어요."],
        ["staff","상자를 저울 위에 올려 주세요.","(손님이 상자를 올린다)"],
        ["staff","무게는 " + v(wTxt) + "입니다.","(저울을 보고 패드에 입력한다)"],
        ["staff","요금은 " + v(feeTxt) + "입니다."],
        ["cust","여기 있어요.","(돈이나 카드를 낸다)"],
        ["staff","감사합니다. 영수증 여기 있습니다."],
        ["staff","내일 도착합니다. 안녕히 가세요."],
        ["cust","감사합니다. 안녕히 계세요."]
      ];
    }
    $("script").innerHTML = lines.map(function(l){
      return "<div class='line " + l[0] + "'><span class='who'>" + (l[0] === "staff" ? "직원" : "손님") +
        "</span><div>" + l[1] + (l[2] ? "<div class='act'>" + l[2] + "</div>" : "") + "</div></div>";
    }).join("");
    var extra = [
      ["staff","받는 분 주소와 전화번호를 써 주세요."],
      ["staff","상자 안에 깨지는 물건이 있나요?"],
      ["staff","잠시만 기다려 주세요."],
      ["cust","언제 도착해요?"],
      ["cust","카드로 계산할게요."]
    ];
    $("extra").innerHTML = extra.map(function(l){
      return "<div class='line " + l[0] + "'><span class='who'>" + (l[0] === "staff" ? "직원" : "손님") + "</span><div>" + l[1] + "</div></div>";
    }).join("");
  }

  // 이벤트
  $("pad").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    press(b.dataset.k || b.textContent.trim());
  });
  $("uG").onclick = function(){ setUnit("g"); };
  $("uKg").onclick = function(){ setUnit("kg"); };
  $("go").onclick = check;
  $("sayBtn").onclick = function(){ buildScript(); $("modal").classList.add("open"); };
  $("closeBtn").onclick = function(){ $("modal").classList.remove("open"); };
  $("modal").addEventListener("click", function(e){
    if (e.target === this){ this.classList.remove("open"); return; }
    var ln = e.target.closest(".line"); if (!ln) return;
    document.querySelectorAll(".line.now").forEach(function(x){ x.classList.remove("now"); });
    ln.classList.add("now");
  });
  $("fsBtn").onclick = function(){
    var d = document;
    if (!d.fullscreenElement){ (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen || function(){}).call(d.documentElement); }
    else { (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
  };
  document.addEventListener("keydown", function(e){
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "." ) press(".");
    else if (e.key === "Backspace") press("back");
    else if (e.key === "Enter") check();
    else if (e.key === "Escape") $("modal").classList.remove("open");
  });

  setUnit("g");
  $("result").classList.remove("stale");
})();
</script>
</body>
</html>
