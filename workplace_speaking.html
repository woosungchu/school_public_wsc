<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직장에서 말하기</title>
<style>
  :root{
    --ink:#15171C; --sub:#767C86; --faint:#A6ACB5;
    --bg:#F2EFE9; --card:#FFFFFF; --line:#E3DFD7;
    --A:#B4543A; --B:#2F6E8F;
    --r1:2.2vmin; --r2:3.4vmin;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{background:var(--bg); color:var(--ink); overflow:hidden; display:flex; flex-direction:column;
       font-family:'Pretendard','맑은 고딕','Malgun Gothic',system-ui,sans-serif;
       font-weight:500; letter-spacing:-.022em;}
  button{font:inherit; letter-spacing:inherit; cursor:pointer; border:0; background:none; color:inherit;}

  header{flex:none; display:flex; align-items:center; gap:1.6vmin; padding:2.2vmin 3.4vmin 1.2vmin;}
  header h1{margin:0; font-size:3.2vmin; font-weight:800; letter-spacing:-.045em;}
  header .sp{flex:1;}
  .seg{display:flex; background:var(--card); border-radius:99vmin; padding:.4vmin;
       box-shadow:0 0 0 .22vmin var(--line);}
  .seg button{border-radius:99vmin; padding:.9vmin 2.6vmin; font-size:2vmin; font-weight:800; color:var(--sub);}
  .seg button.on{background:var(--ink); color:#fff;}
  .pill{background:var(--card); border:.26vmin solid var(--line); border-radius:99vmin;
        padding:1vmin 2.2vmin; font-size:1.9vmin; font-weight:700; color:var(--sub);
        box-shadow:0 .25vmin .7vmin rgba(20,18,14,.05);}
  .pill.on{background:var(--ink); border-color:var(--ink); color:#fff;}
  .pill:active{transform:translateY(.2vmin);}

  .board{flex:1; min-height:0; overflow:auto; padding:0 3.4vmin 3vmin;}
  .grp{margin-bottom:2vmin;}
  .glabel{display:flex; align-items:baseline; gap:1.2vmin; margin:0 0 1.2vmin .3vmin;}
  .glabel b{font-size:2.3vmin; font-weight:800;}
  .glabel span{font-size:1.8vmin; color:var(--sub);}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(26vmin,1fr)); gap:1.3vmin;}
  .card{background:var(--card); border-radius:var(--r1); padding:1.8vmin 1.4vmin;
        display:flex; flex-direction:column; align-items:center; gap:1vmin;
        box-shadow:0 .3vmin 1vmin rgba(20,18,14,.07), 0 0 0 .18vmin rgba(20,18,14,.04);
        transition:transform .1s ease, box-shadow .1s ease;}
  .card:hover{transform:translateY(-.35vmin); box-shadow:0 .9vmin 2.2vmin rgba(20,18,14,.11);}
  .card:active{transform:translateY(0) scale(.985);}
  .chip{width:8vmin; height:8vmin; border-radius:50%; display:grid; place-items:center; flex:none;}
  .chip svg{width:4.8vmin; height:4.8vmin; stroke-width:3.6;}
  .card b{font-size:2.3vmin; font-weight:800; letter-spacing:-.04em; text-align:center;}
  .card small{font-size:1.5vmin; color:var(--sub); font-weight:500; text-align:center; line-height:1.3;}

  .scrim{position:fixed; inset:0; background:rgba(16,14,11,.55); backdrop-filter:blur(.8vmin);
         display:none; align-items:center; justify-content:center; padding:3vmin; z-index:60;}
  .scrim.on{display:flex;}
  .modal{background:var(--card); border-radius:3.4vmin; width:min(150vmin,100%); height:100%;
         overflow:hidden; display:flex; flex-direction:column;
         box-shadow:0 3vmin 9vmin rgba(0,0,0,.4);}
  .mhead{display:flex; align-items:center; gap:1.6vmin; padding:2vmin 3vmin; color:#fff; flex:none;}
  .mhead b{font-size:2.5vmin; font-weight:800;}
  .mhead em{font-style:normal; font-size:1.8vmin; opacity:.72;}
  .mhead .x{margin-left:auto; width:5vmin; height:5vmin; border-radius:50%;
            background:rgba(255,255,255,.18); color:#fff; font-size:2.5vmin; display:grid;
            place-items:center; flex:none;}
  .tabs{flex:none; display:flex; gap:.8vmin; padding:1.4vmin 3vmin 0;}
  .tabs button{border-radius:1.6vmin 1.6vmin 0 0; padding:1.1vmin 2.6vmin;
               font-size:2vmin; font-weight:800; color:var(--sub); background:#F2EFE9;}
  .tabs button.on{background:var(--ink); color:#fff;}

  .body{flex:1; min-height:0; overflow:auto; padding:3vmin 4vmin;}
  .row2{display:flex; align-items:center; gap:4vmin;}
  .bigchip{flex:none; width:26vmin; height:26vmin; border-radius:5vmin; display:grid; place-items:center;}
  .bigchip svg{width:15vmin; height:15vmin; stroke-width:3.4;}
  .rt{flex:1; min-width:0;}
  .bubble{position:relative; background:#FAF8F4; border:.42vmin solid var(--ink); border-radius:3vmin;
          padding:3vmin; font-size:5vmin; font-weight:800; line-height:1.36;
          letter-spacing:-.05em; word-break:keep-all;}
  .bubble.long{font-size:3.8vmin;}
  .bubble::before{content:""; position:absolute; left:-2.3vmin; top:4.4vmin;
        border:2.3vmin solid transparent; border-right-color:var(--ink);}
  .bubble::after{content:""; position:absolute; left:-1.55vmin; top:4.7vmin;
        border:2.05vmin solid transparent; border-right-color:#FAF8F4;}
  .tap{margin:1.1vmin 0 0 .5vmin; font-size:1.7vmin; color:var(--faint);}
  .facts{margin-top:2.4vmin; display:flex; flex-direction:column; gap:1vmin;}
  .fact{display:flex; gap:1.4vmin; align-items:baseline; font-size:2.1vmin; color:var(--sub);
        word-break:keep-all;}
  .fact b{flex:none; font-size:1.6vmin; font-weight:800; color:#fff; background:var(--ink);
          border-radius:99vmin; padding:.5vmin 1.3vmin; letter-spacing:0;}

  .line{display:flex; gap:1.6vmin; align-items:flex-start; margin-bottom:1.6vmin;}
  .who{flex:none; width:11vmin; padding-top:1.1vmin; font-size:1.7vmin;
       font-weight:800; color:var(--faint); text-align:right;}
  .who.me{color:var(--ink);}
  .say{flex:1; background:#FAF8F4; border-radius:2.2vmin; padding:1.8vmin 2.2vmin;
       font-size:2.9vmin; font-weight:600; line-height:1.42; word-break:keep-all;}
  .say:active{background:#EDEAE4;}
  .note{margin:1.2vmin 0 1.6vmin 12.6vmin; font-size:2vmin; color:var(--sub);
        background:#EFEBE3; border-radius:1.6vmin; padding:1.2vmin 1.8vmin; word-break:keep-all;}
  .ans{flex:1; background:#fff; border:.42vmin solid var(--ink); border-radius:2.4vmin;
       padding:2vmin 2.4vmin; font-size:3.4vmin; font-weight:800; line-height:1.34;
       letter-spacing:-.045em; word-break:keep-all;}
  .ans.ph{border-style:dashed; border-color:var(--line); color:var(--faint);
          letter-spacing:.4em; font-weight:500;}
  .badge{display:inline-flex; align-items:center; gap:.7vmin; border-radius:99vmin;
         padding:.5vmin 1.4vmin; font-size:1.5vmin; font-weight:800; color:#fff; margin-bottom:.9vmin;}
  .hint{margin:.9vmin 0 0 .3vmin; font-size:1.8vmin; color:var(--sub); word-break:keep-all;}
  .dim{opacity:.42;}

  .qwrap{text-align:center;}
  .qwrap h2{margin:0; font-size:3.8vmin; font-weight:800; letter-spacing:-.045em;}
  .qwrap h2 small{display:block; font-size:2vmin; color:var(--sub); font-weight:500; margin-top:.9vmin;}
  .opts{display:flex; flex-wrap:wrap; gap:1.6vmin; justify-content:center; margin-top:3vmin;}
  .opt{display:flex; align-items:center; gap:1.6vmin; background:#FAF8F4; border-radius:2.4vmin;
       padding:2.2vmin 2.8vmin; font-size:2.9vmin; font-weight:800; letter-spacing:-.04em;
       min-width:26vmin; justify-content:center; box-shadow:0 0 0 .3vmin var(--line) inset;}
  .opt svg{width:4.8vmin; height:4.8vmin; stroke-width:3.4; color:var(--faint);}
  .opt.ok{background:#E9F5EE; box-shadow:0 0 0 .45vmin #2F7D5C inset;}
  .opt.ok svg{color:#2F7D5C;}
  .opt.no{background:#FBEDEB; box-shadow:0 0 0 .45vmin #C0453B inset; opacity:.5;}
  .fb{margin-top:2.6vmin; font-size:2.4vmin; min-height:3.6vmin; font-weight:700;}
  .fb.good{color:#2F7D5C;} .fb.bad{color:#C0453B;}

  .mfoot{flex:none; display:flex; align-items:center; gap:1.4vmin;
         padding:1.6vmin 3vmin 2.2vmin; border-top:.2vmin solid var(--line);}
  .mbtn{background:#F2EFE9; border-radius:1.8vmin; padding:1.4vmin 2.8vmin; font-size:2.1vmin;
        font-weight:700; color:var(--ink);}
  .mbtn.dark{background:var(--ink); color:#fff;}
  .mbtn:disabled{opacity:.3;}
  .mfoot .mid{flex:1; text-align:center; font-size:1.8vmin; color:var(--faint);}

  .panel{position:fixed; top:8vmin; right:3.4vmin; background:var(--card); border-radius:2.4vmin;
         padding:2vmin 2.2vmin; z-index:70; display:none; max-width:54vmin;
         box-shadow:0 1.6vmin 4.4vmin rgba(20,18,14,.22), 0 0 0 .2vmin var(--line);}
  .panel.on{display:block;}
  .panel h3{margin:0 0 1vmin; font-size:1.6vmin; color:var(--faint); font-weight:800;}
  .panel .row{display:flex; gap:.8vmin; margin-bottom:1.6vmin; flex-wrap:wrap;}
  .panel .row:last-child{margin-bottom:0;}
  .panel select{font:inherit; font-size:1.8vmin; padding:.8vmin 1.2vmin; border-radius:1.2vmin;
                border:.22vmin solid var(--line); background:#fff; max-width:48vmin;}

  .ref{position:fixed; inset:0; background:rgba(16,14,11,.55); display:none;
       align-items:center; justify-content:center; padding:4vmin; z-index:80;}
  .ref.on{display:flex;}
  .refbox{background:var(--card); border-radius:3vmin; padding:3vmin 3.4vmin; max-width:120vmin;
          max-height:100%; overflow:auto;}
  .refbox h2{margin:0 0 .6vmin; font-size:2.8vmin;}
  .refbox h4{margin:2.4vmin 0 1vmin; font-size:2.1vmin;}
  .mv{display:flex; gap:1.4vmin; align-items:baseline; margin-bottom:1vmin; font-size:2vmin;}
  .mv b{flex:none;}
  .mv span{color:var(--sub);}
</style>
</head>
<body>

<header>
  <h1>직장에서 말하기</h1>
  <div class="seg" id="seg">
    <button data-lev="basic" class="on">기본</button>
    <button data-lev="adv">심화</button>
  </div>
  <div class="sp"></div>
  <button class="pill" id="goref">기술 보기</button>
  <button class="pill" id="gear">설정</button>
  <button class="pill" id="full">전체화면</button>
</header>

<div class="panel" id="panel">
  <h3>말 길이 (기본)</h3>
  <div class="row">
    <button class="pill on" data-lv="0">쉬움</button>
    <button class="pill" data-lv="2">어려움</button>
  </div>
  <h3>골라보기 보기 개수</h3>
  <div class="row">
    <button class="pill" data-n="2">2개</button>
    <button class="pill on" data-n="3">3개</button>
    <button class="pill" data-n="4">4개</button>
  </div>
  <h3>목소리</h3>
  <div class="row"><select id="voice"></select></div>
  <h3>말 속도</h3>
  <div class="row">
    <button class="pill" data-rate="0.7">느리게</button>
    <button class="pill on" data-rate="0.85">보통</button>
    <button class="pill" data-rate="1">빠르게</button>
  </div>
  <h3>소리로 읽어주기</h3>
  <div class="row">
    <button class="pill on" data-tts="1">켜기</button>
    <button class="pill" data-tts="0">끄기</button>
  </div>
</div>

<div class="board" id="board"></div>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="ref" id="refs"><div class="refbox" id="refbox"></div></div>

<script>
const B_ICONS = {

  bed: '<path d="M8 44V24M8 32h48v12M56 44v-8"/><circle cx="20" cy="26" r="6"/><path d="M28 32h20v-6a4 4 0 0 0-4-4H30"/>',

  ask: '<path d="M10 16a6 6 0 0 1 6-6h32a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H28l-12 10V42h-0a6 6 0 0 1-6-6z"/><path d="M26 21a6 6 0 1 1 8 6v3"/><circle cx="34" cy="36" r="2.2" fill="currentColor" stroke="none"/>'
};
const GROUPS = [
  { key: 'inout',  name: '출근과 퇴근', color: '#E8734A' },
  { key: 'during', name: '일하는 중', color: '#3D8E6B' },
  { key: 'body',   name: '몸이 불편할 때', color: '#5A6FB5' }

const SITUATIONS = [
  { id: 'late', g: 'inout', icon: 'clock', title: '지각',
    when: '출근 시간에 늦었을 때',

    after: '인사하고 바로 자리로 가서 일을 시작합니다.',

  { id: 'leave', g: 'inout', icon: 'home', title: '퇴근 인사',

    who: '남아 있는 사람들에게',
    lv: ['안녕히 계세요', '먼저 가 보겠습니다', '내일 뵙겠습니다.'],
    after: '인사를 받으면 가볍게 목례하고 나갑니다.',
    why: '인사 없이 사라지면 같이 일하는 사람들이 가장 불편해합니다. 퇴근 인사는 다음 날을 위한 것입니다.' },

    when: '어떻게 하는지 모를 때',
    who: '옆 사람이나 시킨 사람에게',
    lv: ['모르겠어요', '이거 모르겠어요', '이것은 어떻게 하는지 잘 모르겠습니다. 알려 주시겠습니까?'],

    why: '모르는데 그냥 하면 다시 해야 합니다. 묻는 것은 혼나는 일이 아닙니다.' },

  { id: 'help', g: 'during', icon: 'hand', title: '도움 요청',
    when: '혼자 하기 힘들 때, 무거울 때',
    who: '가까이 있는 사람에게',
    lv: ['도와주세요', '저 좀 도와주세요', '저 좀 도와주실 수 있나요?'],
    after: '도와주면 고맙다고 인사합니다.',
    why: '혼자 버티다 다치면 산업재해입니다. 부르는 것이 안전입니다.' },

  { id: 'mistake', g: 'during', icon: 'broken', title: '실수',

    after: '어떻게 할지 알려 줄 때까지 기다립니다.',

  { id: 'toilet', g: 'body', icon: 'toilet', title: '화장실',
    when: '화장실에 가야 할 때',
    who: '옆 사람이나 시킨 사람에게',
    lv: ['화장실', '화장실 가고 싶어요', '저 화장실 좀 다녀와도 되겠습니까?'],

    why: '참으면 아무도 모릅니다. 바로 말해야 병원에 갑니다.' }
];
const REPLY = {
  late:    '네, 어서 들어와서 일 시작해요.',
  leave:   '네, 오늘 수고했어요. 내일 봐요.',
  done:    '잘했어요. 그럼 이번엔 이걸 해 볼까요?',

  mistake: '괜찮아요. 다치지 않았어요? 같이 치워요.',

  hurt:    '어디가 아파요? 어디 봐요.'
};

/* 점장님(교사)이 먼저 던지는 말.
   들으면 무슨 상황인지 바로 알 수 있어야 한다. 돌려서 묻지 않는다. */

    'XX 씨, 우리 가게 아홉 시부터인데 지금 아홉 시 십 분이에요. 방금 들어왔죠?',

function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v => (v.lang||'').toLowerCase().startsWith('ko'));
  const sel = document.getElementById('voice');
  if (!voices.length){ sel.innerHTML = '<option>한국어 음성 없음</option>'; return; }
  sel.innerHTML = voices.map((v,i) => '<option value="'+i+'">'+v.name+'</option>').join('');
  if (voiceIdx < 0) voiceIdx = 0;
  sel.value = voiceIdx;
}
loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;

function say(t){
  if (!ttsOn || !t) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang='ko-KR'; u.rate=rate; u.volume=1; u.pitch=1;
  if (voices[voiceIdx]) u.voice = voices[voiceIdx];
  speechSynthesis.speak(u);
}
const plain = s => s.replace(/^[^—]*—\s*/, '');

/* ── 심화 ──
   상대 대사(+상황 설명)와 내 빈칸을 한 묶음으로 본다.
   [대답 보기] -> [다음 문제] 두 번만 누른다. */
function buildSteps(s){
  const out = []; let buf = [];
  s.turns.forEach(t => {
    if (t.me){ out.push({ctx: buf, me: t}); buf = []; }
    else buf.push(t);
  });
  if (buf.length) out.push({ctx: buf, me: null});
  return out;
}
function renderAdv(){
  const s = cur, c = TRACK[s.track].c;
  modal.innerHTML =
    '<div class="mhead" style="background:'+c+'">' +
      '<b>'+s.name+'</b><em>'+s.place+' · '+s.other+'</em>' +
      '<button class="x" data-close>&#10005;</button></div>' +
    '<div class="body" id="body"></div>' +
    '<div class="mfoot">' +
      '<button class="mbtn" id="back">&#9664; 처음부터</button>' +
      '<div class="mid" id="mid"></div>' +
      '<button class="mbtn dark" id="go"></button></div>';
  paintAdv(); sayStep();
}
function paintAdv(){
  const f = document.getElementById('body');
  let h = '';
  for (let i = 0; i < si; i++) h += stepHtml(steps[i], true, i);
  if (si < steps.length) h += stepHtml(steps[si], false, si);
  f.innerHTML = h; f.scrollTop = f.scrollHeight;
  const done = si >= steps.length;
  document.getElementById('mid').textContent = done ? '끝' : (si+1)+' / '+steps.length;
  document.getElementById('go').innerHTML = done ? '처음부터 &#9654;'
    : (stage === 0 && steps[si].me) ? '대답 보기 &#9654;' : '다음 문제 &#9654;';
}
function stepHtml(st, past, idx){
  const c = TRACK[cur.track].c;
  let h = '';
  st.ctx.forEach((t, k) => {
    if (t.note) h += '<div class="note'+(past?' dim':'')+'">'+t.note+'</div>';
    else h += '<div class="line'+(past?' dim':'')+'"><span class="who">'+cur.other+'</span>' +
              '<div class="say" data-step="'+idx+'" data-ci="'+k+'">'+t.who+'</div></div>';
  });
  if (!st.me) return h;
  const t = st.me, m = MOVES[t.move], sh = past || stage >= 1;
  return h + '<div class="line'+(past?' dim':'')+'"><span class="who me">나</span><div style="flex:1">' +
    '<span class="badge" style="background:'+c+'">'+t.move.toUpperCase()+' '+m.t+'</span>' +
    '<div class="ans'+(sh?'':' ph')+'" data-ast="'+idx+'">'+(sh ? t.model : '· · ·')+'</div>' +
    (t.hint && !sh ? '<div class="hint">'+t.hint+'</div>' : '') +
    (sh ? '<div class="hint">'+m.d+'</div>' : '') + '</div></div>';
}
function sayStep(){
  if (si >= steps.length) return;
  const w = steps[si].ctx.filter(t => t.who);
  if (w.length) say(plain(w[w.length-1].who));
}
function advGo(){
  if (si >= steps.length){ si = 0; stage = 0; paintAdv(); sayStep(); return; }
  if (stage === 0 && steps[si].me){ stage = 1; paintAdv(); say(steps[si].me.model); return; }
  si++; stage = 0; paintAdv(); sayStep();
}

function drawRef(){
  const grp = k => Object.keys(MOVES).filter(x => x[0] === k).map(x =>
    '<div class="mv"><b style="color:'+(k==='a'?TRACK.A.c:TRACK.B.c)+'">'+x.toUpperCase()+
    ' '+MOVES[x].t+'</b><span>'+MOVES[x].d+'</span></div>').join('');
  document.getElementById('refbox').innerHTML =
    '<h2>말하기 기술</h2>' +
    '<h4 style="color:'+TRACK.A.c+'">갈래 A · 고객 응대 — 상대의 기분을 배려한다</h4>' + grp('a') +
    '<h4 style="color:'+TRACK.B.c+'">갈래 B · 직장 내부 — 정확하게 주고받는다</h4>' + grp('b') +
    '<div class="hint" style="margin-top:2.4vmin">아무 데나 누르면 닫힙니다</div>';
}

/* ── 조작 ── */
document.addEventListener('click', e => {
  const seg = e.target.closest('[data-lev]');
  if (seg){ level = seg.dataset.lev; closeModal();
    document.querySelectorAll('[data-lev]').forEach(b => b.classList.toggle('on', b === seg));
    drawBoard(); return; }
  if (e.target.closest('#gear')) { document.getElementById('panel').classList.toggle('on'); return; }
  if (e.target.closest('#goref')) { drawRef(); document.getElementById('refs').classList.add('on'); return; }
  if (e.target.closest('#refs') && !e.target.closest('.mv')) {
    document.getElementById('refs').classList.remove('on'); return; }
  if (e.target.closest('#full')) {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
    return; }
  if (e.target.closest('[data-close]') || e.target === scrim) { closeModal(); return; }

  const c = e.target.closest('[data-open]');
  if (c) { openCard(c.dataset.open); return; }
  if (!cur) {
    if (!e.target.closest('.panel') && !e.target.closest('#gear'))
      document.getElementById('panel').classList.remove('on');
  }

  /* 기본 */
  const tb = e.target.closest('[data-tab]');
  if (tb){ tab = tb.dataset.tab; if (tab === 'quiz') qSit = null; renderBasic(); return; }
  if (e.target.closest('#bub')) { say(cur.lv[lv]); return; }
  if (e.target.closest('#cue')) { say(cue); return; }
  if (e.target.closest('#recue')) { newCue(); shown = 0; renderBasic(); return; }
  if (e.target.closest('#reveal')) {
    if (!shown){ shown = 1; renderBasic(); say(cur.lv[lv]); }
    else { const i = SITUATIONS.indexOf(cur);
      cur = SITUATIONS[(i+1) % SITUATIONS.length]; shown = 0; newCue(); renderBasic(); }
    return; }
  if (e.target.closest('#ans') && shown) { say(cur.lv[lv]); return; }
  if (e.target.closest('#prev')) { cur = SITUATIONS[SITUATIONS.indexOf(cur)-1]; renderBasic(); return; }
  if (e.target.closest('#next')) { cur = SITUATIONS[SITUATIONS.indexOf(cur)+1]; renderBasic(); return; }
  if (e.target.closest('#requiz')) { qSit = null; renderBasic(); return; }
  const o = e.target.closest('[data-pick]');
  if (o){ const fb = document.getElementById('fb');
    if (o.dataset.pick === cur.id){ o.classList.add('ok');
      fb.className = 'fb good'; fb.textContent = '맞았어요 — ' + REPLY[cur.id];
      say(cur.lv[lv] + '. ' + REPLY[cur.id]); }
    else { o.classList.add('no'); o.disabled = true;
      fb.className = 'fb bad'; fb.textContent = '다시 골라 보세요'; say('다시 골라 보세요'); }
    return; }

  /* 심화 */
  if (e.target.closest('#go')) { advGo(); return; }
  if (e.target.closest('#back')) { si = 0; stage = 0; paintAdv(); sayStep(); return; }
  const sy = e.target.closest('[data-step]');
  if (sy && cur) { say(plain(steps[+sy.dataset.step].ctx[+sy.dataset.ci].who)); return; }
  const an = e.target.closest('[data-ast]');
  if (an && cur){ const i = +an.dataset.ast;
    if (i < si || stage >= 1) say(steps[i].me.model); return; }

  /* 설정 */
  const L = e.target.closest('[data-lv]');
  if (L){ lv = +L.dataset.lv;
    document.querySelectorAll('[data-lv]').forEach(b => b.classList.toggle('on', b === L));
    drawBoard(); if (cur && level === 'basic') renderBasic(); return; }
  const nn = e.target.closest('[data-n]');
  if (nn){ nOpt = +nn.dataset.n;
    document.querySelectorAll('[data-n]').forEach(b => b.classList.toggle('on', b === nn));
    if (cur && tab === 'quiz'){ qSit = null; renderBasic(); } return; }
  const r = e.target.closest('[data-rate]');
  if (r){ rate = +r.dataset.rate;
    document.querySelectorAll('[data-rate]').forEach(b => b.classList.toggle('on', b === r)); return; }
  const tt = e.target.closest('[data-tts]');
  if (tt){ ttsOn = +tt.dataset.tts;
    document.querySelectorAll('[data-tts]').forEach(b => b.classList.toggle('on', b === tt));
    if (!ttsOn) speechSynthesis.cancel(); return; }

  if (!e.target.closest('.panel') && !e.target.closest('#gear'))
    document.getElementById('panel').classList.remove('on');
});

document.getElementById('voice').addEventListener('change', e => { voiceIdx = +e.target.value; });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); document.getElementById('refs').classList.remove('on'); }
  else if (cur && level === 'adv' && (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ')) {
    e.preventDefault(); advGo(); }
  else if (cur && level === 'basic' && tab === 'learn'){
    const i = SITUATIONS.indexOf(cur);
    if (e.key === 'ArrowRight' && i < SITUATIONS.length-1){ e.preventDefault(); cur = SITUATIONS[i+1]; renderBasic(); }
    if (e.key === 'ArrowLeft' && i > 0){ e.preventDefault(); cur = SITUATIONS[i-1]; renderBasic(); }
  }
});

drawBoard();
</script>
</body>
</html>
